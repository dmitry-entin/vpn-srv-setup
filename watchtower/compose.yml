services:
  watchtower:
#    image: containrrr/watchtower
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
#      - DOCKER_API_VERSION=1.44
      - TZ=Europe/Moscow
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 3 * * *